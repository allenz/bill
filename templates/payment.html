<!doctype html>
<html>
<head>
<title>Payment</title>
<link rel="stylesheet" href="https://cdn.datatables.net/3.1.3/css/dataTables.dataTables.min.css" crossorigin="anonymous">
<script src="https://cdn.datatables.net/3.1.3/js/dataTables.min.js" crossorigin="anonymous"></script>
<link href="https://cdn.datatables.net/fixedheader/5.1.2/css/fixedHeader.dataTables.min.css" rel="stylesheet">
<script src="https://cdn.datatables.net/fixedheader/5.1.2/js/dataTables.fixedHeader.min.js" crossorigin="anonymous"></script>
<style>
  body { font-family: sans-serif; margin: 1em; }
  a { margin-right: 1em; }
  td.num { text-align: right; }
  tr.deleted { font-style: italic; }

  /* Hide sort arrows */
  table.dataTable thead > tr > th.dt-orderable-asc .dt-column-order { display: none; }
  table.dataTable thead > tr > th { padding-right: 10px !important; }
</style>
</head>
<body>
  {% set active = "Payment" %}
  {% include "header_nav.html" %}
  <h1>Payment</h1>
  <p>All payment rows; sorting, paging and filtering are done by the server.</p>
  <p>
    Paid equals:
    <input id="paidEq" list="paidValues" placeholder="e.g. 20" style="width: 6em;">
    <datalist id="paidValues">
      {% for v in paid_values %}<option value="{{ v }}">{% endfor %}
    </datalist>
  </p>
  <table id="paymentTable" class="display" style="width:100%">
    <thead>
      <tr>{{ header | safe }}</tr>
    </thead>
    <tbody></tbody>
  </table>

<script>
document.addEventListener('DOMContentLoaded', () => {
  // COLUMNS/NUMERIC mirror PAY_COLUMNS/PAY_NUMERIC_COLUMNS in app.py; the
  // API's data rows are keyed by these names.
  const COLUMNS = {{ columns | tojson }};
  const NUMERIC = {{ numeric | tojson }};

  const table = new DataTable('#paymentTable', {
    serverSide: true,
    processing: true, // Shows a "Loading..." indicator
    fixedHeader: true,
    pageLength: 100,
    order: [], // no client sort; the server falls back to newest first
    columns: COLUMNS.map((name) => ({ data: name, name })),
    columnDefs: [{
      targets: NUMERIC.map((n) => COLUMNS.indexOf(n)),
      className: 'num', // right-align the amount columns
    }],
    // Italicize payments deleted in ECW (deleted cell is the text "1").
    createdRow: (row, data) => {
      if (data.deleted === "1") row.classList.add("deleted");
    },
    ajax: {
      url: '/api/payment',
      type: 'GET',
      // Send the current "paid equals" value with every request.
      data: (d) => { d.paid = document.getElementById('paidEq').value.trim(); },
    },
  });

  // Re-fetch (resetting to the first page) when the filter changes.
  document.getElementById('paidEq').addEventListener('change',
    () => table.ajax.reload(() => {}, true));
});
</script>
</body>
</html>
