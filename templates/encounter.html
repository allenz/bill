<!doctype html>
<html>
<head>
<title>Encounter</title>
<link rel="stylesheet" href="https://cdn.datatables.net/3.1.3/css/dataTables.dataTables.min.css" crossorigin="anonymous">
<script src="https://cdn.datatables.net/3.1.3/js/dataTables.min.js" crossorigin="anonymous"></script>
<link href="https://cdn.datatables.net/fixedheader/5.1.2/css/fixedHeader.dataTables.min.css" rel="stylesheet">
<script src="https://cdn.datatables.net/fixedheader/5.1.2/js/dataTables.fixedHeader.min.js" crossorigin="anonymous"></script>
<style>
  body { font-family: sans-serif; margin: 1em; }
  a { margin-right: 1em; }
  td.num { text-align: right; }

  /* Hide sort arrows */
  table.dataTable thead > tr > th.dt-orderable-asc .dt-column-order { display: none; }
  table.dataTable thead > tr > th { padding-right: 10px !important; }
</style>
</head>
<body>
  {% set active = "Encounter" %}
  {% include "header_nav.html" %}
  <h1>Encounter</h1>
  <p>All encounters; sorting and paging are done by the server.</p>
  <table id="encounterTable" class="display" style="width:100%">
    <thead>
      <tr>{{ header | safe }}</tr>
    </thead>
    <tbody></tbody>
  </table>

<script>
document.addEventListener('DOMContentLoaded', () => {
  // COLUMNS/NUMERIC mirror ENCOUNTER_COLUMNS/ENCOUNTER_NUMERIC_COLUMNS in
  // app.py; the API's data rows are keyed by these names.
  const COLUMNS = {{ columns | tojson }};
  const NUMERIC = {{ numeric | tojson }};

  new DataTable('#encounterTable', {
    serverSide: true,
    processing: true, // Shows a "Loading..." indicator
    fixedHeader: true,
    pageLength: 100,
    order: [[COLUMNS.indexOf('date'), 'desc']], // newest first
    columns: COLUMNS.map((name) => ({ data: name, name })),
    columnDefs: [{
      targets: NUMERIC.map((n) => COLUMNS.indexOf(n)),
      className: 'num', // right-align the amount columns
    }],
    ajax: {
      url: '/api/encounter',
      type: 'GET',
    },
  });
});
</script>
</body>
</html>
