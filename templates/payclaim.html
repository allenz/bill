<!doctype html>
<html>
<head>
<title>PayClaim</title>
<link rel="stylesheet" href="https://cdn.datatables.net/3.1.3/css/dataTables.dataTables.min.css" crossorigin="anonymous">
<script src="https://cdn.datatables.net/3.1.3/js/dataTables.min.js" crossorigin="anonymous"></script>
<link href="https://cdn.datatables.net/fixedheader/5.1.2/css/fixedHeader.dataTables.min.css" rel="stylesheet">
<script src="https://cdn.datatables.net/fixedheader/5.1.2/js/dataTables.fixedHeader.min.js" crossorigin="anonymous"></script>
<style>
  body { font-family: sans-serif; margin: 1em; }
  a { margin-right: 1em; }

  /* Hide sort arrows */
  table.dataTable thead > tr > th.dt-orderable-asc .dt-column-order { display: none; }
  table.dataTable thead > tr > th { padding-right: 10px !important; }
</style>
</head>
<body>
  {% set active = "PayClaim" %}
  {% include "header_nav.html" %}
  <h1>PayClaim</h1>
  <p>The 500 most recent payment rows (server limit).</p>
  <table id="payclaimTable" class="display" style="width:100%">
    <thead>
      <tr>{{ header | safe }}</tr>
    </thead>
    <tbody>
{{ body | safe }}
    </tbody>
  </table>

<script>
document.addEventListener('DOMContentLoaded', () => {
  new DataTable('#payclaimTable', {
    fixedHeader: true,
    pageLength: -1,
    order: [],
  });
});
</script>
</body>
</html>
